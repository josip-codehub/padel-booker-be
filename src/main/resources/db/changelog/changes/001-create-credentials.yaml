databaseChangeLog:
  - changeSet:
      id: 001-create-credentials
      author: padel-booker
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: password
                  type: varchar(255)
              - column:
                  name: token
                  type: text
              - column:
                  name: token_expires_at
                  type: timestamptz
              - column:
                  name: last_validated_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
