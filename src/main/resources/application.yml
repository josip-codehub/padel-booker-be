server:
  port: 8080

spring:
  application:
    name: padel-booker-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/padel}
    username: ${DB_USER:padel}
    password: ${DB_PASSWORD:padel}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  auth:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:}          # REQUIRED for a public deploy; blank = API locked down
    secret: ${APP_AUTH_SECRET:}         # set to persist logins across restarts
    token-ttl-days: 30

sporty:
  auth-base-url: ${SPORTY_AUTH_BASE_URL:https://api.sporty.plus/api/v3}
  api-base-url: ${SPORTY_API_BASE_URL:https://api.tenis.plus/v2}
  origin: ${SPORTY_ORIGIN:https://modesto.sporty.plus}
  portal-origin: ${SPORTY_PORTAL_ORIGIN:https://my.sporty.plus}
  language: en
  club-id: ${SPORTY_CLUB_ID:139}
  timezone: Europe/Zagreb
  max-reservation-span-days: 7
  reservation-version: "20250422"
  booking:
    # How the midnight burst behaves.
    first-attempt-after-ms: 200   # fire the FIRST attempt this many ms AFTER the server's midnight
    interval-ms: 250              # gap between consecutive attempts in the burst
    give-up-ms: 15000            # stop retrying this long AFTER the target instant
    clock-sync-lead-seconds: 45   # measure the server-clock offset this long before target
    pre-roll-seconds: 5          # wake the fire thread this long before it needs to spin

logging:
  level:
    org.padel.booker: DEBUG
